model: 
  name: dualtrack_fusion_model
  load_kw:
    strict: true
    handle_size_mismatch: false
  global_encoder_cfg: 
    name: global_encoder_cnn # reflect the choice of model used in the global encoder
    checkpoint: "/home/syahid/github/DualTrack/experiments/global_origin/checkpoint/best.pt" # Set to the best checkpoint output by global encoder, e.g., global_encoder_log_dir/checkpoints/best.pt
    load_kw:
      strict: true
      handle_size_mismatch: false
  local_encoder_cfg: 
    name: dualtrack_loc_enc_stg3 # Matches the CNN used by local_s1 and local_s2.
    checkpoint: "/home/syahid/github/DualTrack/experiments/local_s3/checkpoint/best.pt"
    max_position_embeddings: 4096 # Must match stage3's learned relative embeddings.
    freeze_backbone: true
    use_cache: false
    load_kw:
      strict: true
      handle_size_mismatch: false

data: 
  dataset: tus-rec
  num_workers: 1
  global_encoder_preprocessing_kw:  
    in_channels: 1
    mean: [0.5] # update based on which global encoder you are using.
    std: [0.25]
    resize_to: [224, 224]
  local_encoder_preprocessing_kw: 
    resize_to: [256, 256]
  use_augmentations: false
  load_preprocessed_images_from_disk: false
  batch_size: 1
  subsequence_length_train: null
  
train: 
  lr: 0.0001
  epochs: 500
  warmup_epochs: 10
  weight_decay: 0.0
  val_every: 10

seed: 0
device: cuda
use_amp: true

logger: wandb
logger_kw: 
  wandb_project: dualtrack
evaluator_kw:   
  include_images: true

debug: false
no_resume: true
