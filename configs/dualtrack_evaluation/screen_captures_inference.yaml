model:
  name: dualtrack_tus_rec_2024
  pretrained: false

data:
  dataset: screen-captures
  num_workers: 1
  global_encoder_preprocessing_kw:
    in_channels: 1
    mean: [0.5]
    std: [0.25]
    resize_to: [224, 224]
  use_augmentations: false
  load_preprocessed_images_from_disk: false
  batch_size: 1
  features_paths: {}
  subsequence_length_train: null

train:
  lr: 0.0001
  epochs: 1
  warmup_epochs: 0
  weight_decay: 0.0
  val_every: 1

seed: 0
log_dir: /home/syahid/github/DualTrack/experiments/eval/screen_captures
device: cuda
use_amp: true

logger: console
debug: false
